[package]
name = "ms"
version = "0.4.0"
repository = "https://github.com/gitduk/ms"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# unstable-dynamic may break in any release; bump deliberately
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
toml_edit = "0.25"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Ship only GitHub Releases, never crates.io
[package.metadata.release]
publish = false
